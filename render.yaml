# Render blueprint: backend + PostgreSQL (the backend enables the pgvector extension on start).
# The widget and the staff portal are deployed separately on Vercel (root directories web/, admin/).
databases:
  - name: healthcare-chatbot-db
    plan: free
    databaseName: clinic
    user: clinic

services:
  - type: web
    name: healthcare-chatbot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LLM_PROVIDER
        value: google
      - key: MAIN_MODEL
        sync: false
      - key: CLASSIFIER_MODEL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: STAFF_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-chatbot-db
          property: connectionString
